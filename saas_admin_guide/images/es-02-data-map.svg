<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .box-accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 12; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc" />

  <text x="60" y="60" class="title">Mapa de datos (Admin)</text>
  <text x="60" y="90" class="small">Relaciones clave entre catálogo, planes, entitlements y ventas</text>

  <!-- Left column: catálogo -->
  <rect x="60" y="140" width="320" height="120" class="box" />
  <text x="80" y="180" class="label">Expert Advisors</text>
  <text x="80" y="210" class="small">EA / Tool / Indicator / Script</text>

  <rect x="60" y="290" width="320" height="120" class="box" />
  <text x="80" y="330" class="label">Cursos</text>
  <text x="80" y="360" class="small">Con módulos y lecciones</text>

  <rect x="60" y="440" width="320" height="120" class="box" />
  <text x="80" y="480" class="label">Assets Marketplace</text>
  <text x="80" y="510" class="small">PDFs, plantillas, etc.</text>

  <rect x="60" y="590" width="320" height="120" class="box" />
  <text x="80" y="630" class="label">Bundles de EA</text>
  <text x="80" y="660" class="small">Archivos por combinación</text>

  <!-- Center: entitlements -->
  <rect x="520" y="300" width="360" height="150" class="box-accent" />
  <text x="550" y="345" class="label">Entitlements</text>
  <text x="550" y="375" class="small">Acceso a EA / Curso / Asset</text>
  <text x="550" y="405" class="small">Billing Plan, Course Plan, Asset Plan</text>

  <!-- Right column: billing + marketplace -->
  <rect x="980" y="140" width="340" height="120" class="box" />
  <text x="1000" y="180" class="label">Billing Plans</text>
  <text x="1000" y="210" class="small">Suscripciones (tiers)</text>

  <rect x="980" y="300" width="340" height="140" class="box" />
  <text x="1000" y="340" class="label">Marketplace Products</text>
  <text x="1000" y="370" class="small">Compra única</text>
  <text x="1000" y="400" class="small">Crea Billing Plan one-time</text>

  <rect x="980" y="490" width="340" height="120" class="box" />
  <text x="1000" y="530" class="label">Add-ons</text>
  <text x="1000" y="560" class="small">Extienden EA / Curso / Asset</text>

  <!-- Course structure -->
  <rect x="420" y="470" width="170" height="80" class="box" />
  <text x="440" y="515" class="small">Módulos</text>

  <rect x="620" y="470" width="170" height="80" class="box" />
  <text x="640" y="515" class="small">Lecciones</text>

  <!-- Arrows -->
  <path d="M380 200 L520 340" class="arrow" />
  <path d="M380 350 L520 370" class="arrow" />
  <path d="M380 500 L520 410" class="arrow" />

  <path d="M980 200 L880 340" class="arrow" />
  <path d="M980 360 L880 380" class="arrow" />

  <path d="M1150 440 L1150 490" class="arrow" />

  <path d="M220 410 L420 470" class="arrow" />
  <path d="M505 510 L620 510" class="arrow" />

  <path d="M220 550 L220 590" class="arrow" />

  <!-- Footer note -->
  <text x="60" y="820" class="small">Tip: los productos one-time gestionan entitlements desde su propio formulario.</text>
</svg>
