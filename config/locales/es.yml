            a: "Los niveles superiores desbloquean más herramientas y capacidad (EAs, cuentas y funciones de flujo de trabajo)."
          - q: "¿Puedo cambiar de plan después?"
            a: "Sí; puedes subir o bajar de plan en cualquier momento. Los cambios se aplican de inmediato y se prorratean cuando corresponde."
          - q: "¿Mensual vs anual, qué cambia?"
            a: "La facturación anual se cobra una vez al año e incluye cualquier descuento disponible; la mensual se cobra cada mes."
          - q: "¿Dónde gestiono facturas y métodos de pago?"
            a: "Usa la página de Facturación para abrir el portal y descargar facturas."
