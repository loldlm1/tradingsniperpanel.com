    secondary_cta: "Leer los manuales"
  features:
    title: "Pensado para traders disciplinados"
    items:
      risk:
        title: "Caja de riesgo que respeta los límites del broker"
        body: "Cambia entre Lot/%/$ con validaciones en vivo, tooltips de ajuste y respuesta fluida."
      scope:
        title: "Flujo Sniper Scope"
        body: "Apunta TP/SL con el crosshair, confirma con Enter/Esc y recorre tickets con el cycle navigator."
      grid:
        title: "Proyecciones adaptables"
        body: "Activa split trades, profundidad de grid 1-3 capas y escaleras de TP sin soltar el teclado."
      theme:
        title: "Temas y hotkeys persistentes"
        body: "Toggle dark/light, etiquetas responsivas, configs por gráfico y atajos/colores editables."
  workflow:
    title: "Control total desde la proyección hasta el cierre"
    steps:
      projection:
        title: "Proyección"
        body: "Lanza BUY/SELL con multiplicadores de TP y capas de grid."
      signal:
        title: "Gestión de señales"
        body: "Recorre señales o tickets para cierres parciales/totales y movimientos a break-even."
      scope:
        title: "Reapuntar con Scope"
        body: "Bloquea TP/SL con el crosshair antes de enviar ajustes precisos."
