      - "Cycle navigator para cierres parciales/totales, break-even y objetivos de scope."
      - "Flujo Sniper Scope con crosshair para retargetear TP/SL y confirmar con Enter/Esc."
      - "Temas persistentes, etiquetas responsivas y hotkeys/colores editables por gráfico."
